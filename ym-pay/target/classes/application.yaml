server:
  port: 8084

spring:
  cloud:
    nacos:
      discovery:
        group: DEFAULT_GROUP

# XXL-JOB 配置（Nacos不可用时使用本地默认值）
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    accessToken: default_token
    executor:
      appname: ym-pay
      port: 9995
      logpath: /data/applogs/xxl-job/ym-pay
      logretentiondays: 30