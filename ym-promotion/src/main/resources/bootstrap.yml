spring:
  application:
    name: ym-promotion
  cloud:
    nacos:
      server-addr: 192.168.150.101:8848
      discovery:
        group: DEFAULT_GROUP
      config:
        file-extension: yaml
        shared-configs:
          - data-id: shared-redis.yaml
            refresh: false
          - data-id: shared-jwt.yaml
            refresh: false
          - data-id: shared-logs.yaml
            refresh: false
          - data-id: ym-promotion.yaml
            refresh: false
          - data-id: shared-mq.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-xxljob.yaml
            refresh: true

xxl:
  job:
    executor:
      appname: ym-promotion-executor
      port: 9999
      logpath: /data/applogs/xxl-job/ym-promotion
      logretentiondays: 30

server:
  port: 8093
