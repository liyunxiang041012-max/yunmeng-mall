# ========================
# DeepSeek V4 Pro 配置（需要你填写 api-key）
# ========================
deepseek:
  api-key: sk-your-deepseek-api-key-here  # 请替换为你自己的 DeepSeek API Key，切勿提交真实密钥
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout: 30
  temperature: 0.7
  max-tokens: 1000

logging:
  level:
    com.liyun.ai: debug
