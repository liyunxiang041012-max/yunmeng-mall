# ===========================================
# Seata 客户端共享配置 → Nacos: shared-seata.yaml
# 所有参与分布式事务的微服务引用此配置
# ===========================================
seata:
  # 事务分组：映射到 Seata Server 集群名
  tx-service-group: yunmeng-mall-group
  # 事务分组 → 集群名映射
  service:
    vgroup-mapping:
      yunmeng-mall-group: default
  # Nacos 注册中心（发现 Seata Server）
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 192.168.150.101:8848
      namespace: ""
      group: DEFAULT_GROUP
  # Nacos 配置中心（拉取 Seata Server 配置）
  config:
    type: nacos
    nacos:
      server-addr: 192.168.150.101:8848
      namespace: ""
      group: SEATA_GROUP
      data-id: seataServer.properties
  # undo_log 序列化方式
  client:
    undo:
      log-serialization: jackson
