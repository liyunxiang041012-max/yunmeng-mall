spring:
  application:
    name: ym-item
  cloud:
    nacos:
      server-addr: 192.168.150.101:8848
      config:
        file-extension: yaml
        shared-configs:
          - data-id: shared-redis.yaml
            refresh: false
          - data-id: shared-jwt.yaml
            refresh: false
          - data-id: shared-logs.yaml
            refresh: false
          - data-id: ym-item.yaml
            refresh: false
          - data-id: shared-mq.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-xxljob.yaml
            refresh: true
          - data-id: shared-oss.yaml
            group: DEFAULT_GROUP
            refresh: false
xxl:
  job:
    executor:
      appname: ym-item-executor
      port: 9998
      logpath: /data/applogs/xxl-job/ym-item
      logretentiondays: 30