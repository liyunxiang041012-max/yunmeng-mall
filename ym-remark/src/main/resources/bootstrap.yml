spring:
  application:
    name: ym-remark
  cloud:
    nacos:
      server-addr: 192.168.150.101:8848
      discovery:
        group: DEFAULT_GROUP
      config:
        file-extension: yaml
        shared-configs:
          - data-id: shared-redis.yaml
            refresh: false
          - data-id: shared-jwt.yaml
            refresh: false
          - data-id: shared-logs.yaml
            refresh: false
          - data-id: ym-remark.yaml
            refresh: false
          - data-id: shared-mq.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-xxljob.yaml
            refresh: true

server:
  port: 8094

xxl:
  job:
    executor:
      appname: ym-remark-executor
      port: 9996
      logpath: /data/applogs/xxl-job/ym-remark
      logretentiondays: 30
